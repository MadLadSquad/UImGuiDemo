<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="A showcase of the capabilities of the UntitledImGuiFramework">
        <meta name="author" content="MadLadSquad">
        <meta name="keywords" content="imgui,dear imgui,implot,madladsquad,MadLadSquad,Dear ImGui,Dear imgui,ImGui,IMGUI,DEAR IMGUI,ImPlot,imspinner,ImSpinner,ImGuiToggles,imguitoggles,ImKnobs,imknobs">

        <title>UntitledImGuiFramework Demo</title>

        <link rel="icon" type="image/png" href="./favicon.png">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Ubuntu&display=swap" rel="stylesheet" type="text/css">
        <link rel="stylesheet" href="./main.css" type="text/css">
    </head>
    <body>
        <div id="privacy-popup" role="dialog" aria-modal="true" aria-labelledby="privacy-title" hidden>
            <div id="privacy-card">
                <h2 id="privacy-title">Privacy notice</h2>
                <p>
                    Before the demo loads, please take a moment to read our
                    <a href="https://madladsquad.com/privacy-policy" target="_blank" rel="noopener noreferrer">privacy policy</a>.
                    By continuing, you agree to its terms.
                </p>
                <button id="privacy-accept" type="button">Continue</button>
            </div>
        </div>
        <p id="overlay" hidden>Loading...</p>
        <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
        <footer id="footer" hidden>
            Copyright &copy; Heapforge Ltd. 2024 - 2026.
            <a href="https://madladsquad.com/privacy-policy" target="_blank" rel="noopener noreferrer">Privacy policy</a>.
        </footer>

        <script type='text/javascript'>
            function $(x) { return document.getElementById(x) }

            // Only show the footer when the page is not embedded in an iframe. Accessing window.top can throw for
            // cross-origin parents, which also means we are embedded. This runs before the WASM module loads, so the
            // canvas already has its final CSS size when the framework first reads it.
            var bEmbedded = true;
            try { bEmbedded = window.self !== window.top; } catch (e) {}
            if (!bEmbedded)
                $('footer').hidden = false;

            var Module = {
                canvas: (() => { return $('canvas'); })(),
                onRuntimeInitialized: () => { $('overlay').hidden = true; },
            };

            function loadDemo()
            {
                $('privacy-popup').hidden = true;
                $('overlay').hidden = false;

                var script = document.createElement('script');
                script.src = './UImGuiDemo.js';
                document.body.appendChild(script);
            }

            var bAccepted = false;
            try { bAccepted = localStorage.getItem('privacy-accepted') === '1'; } catch (e) {}

            if (bAccepted)
                loadDemo();
            else
            {
                $('privacy-popup').hidden = false;
                $('privacy-accept').focus();
                $('privacy-accept').addEventListener('click', () => {
                    try { localStorage.setItem('privacy-accepted', '1'); } catch (e) {}
                    loadDemo();
                }, { once: true });
            }
        </script>
    </body>
</html>
